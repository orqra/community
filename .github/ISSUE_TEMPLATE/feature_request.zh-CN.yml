name: 功能建议（中文）
description: 说明你的使用场景和希望改进的地方。
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有建议；相同需求可以在原讨论中补充。
        此表单及附件会公开，请勿提交 API Key、Token、License Key、个人资料或私有项目内容。
        建议会作为产品改进参考，不代表已经承诺实现或排期。
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与困难
      description: 你想完成什么？目前在哪一步遇到困难？请用不含私有内容的例子说明。
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 希望怎样改进
      description: 你希望 Orqra 提供什么能力或怎样调整现有操作？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 当前做法或其他想法（可选）
      description: 你现在如何完成这件事？还考虑过哪些办法？
  - type: checkboxes
    id: public_content
    attributes:
      label: 公开内容检查
      options:
        - label: 我已检查文字和附件，并移除凭证、License 信息、个人资料和私有项目内容。
          required: true
